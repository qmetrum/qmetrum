name: Deploy backend

# DORMANT since 2026-10-01: the AWS footprint this deploys to was torn down for cost
# reasons (~$131/mo). The ECR repo, ECS cluster/service and ALB no longer exist, so the
# push trigger is disabled — otherwise every backend commit fails this workflow.
# Left in place (dispatch-only) because it's a working pipeline worth keeping for a
# future redeploy. To revive: recreate ECR + ECS cluster/service, re-check the
# AWS_REGION / ECR_REPOSITORY / ECS_CLUSTER / ECS_SERVICE repo secrets, then restore
# the `push:` block below.
on:
  # push:
  #   branches: [main, master]
  #   paths:
  #     - 'services/forecasting_service_py/**'
  #     - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# OIDC needs id-token: write. We don't push to the repo from the workflow,
# so contents: read is enough.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}        # e.g. qsight-backend
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}              # e.g. qsight-cluster
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}              # e.g. qsight-backend

jobs:
  deploy:
    name: Build → ECR → ECS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPO: ${{ env.ECR_REPOSITORY }}
          GIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${GIT_SHA::7}"
          IMAGE_SHA="$REGISTRY/$REPO:$SHORT_SHA"
          IMAGE_LATEST="$REGISTRY/$REPO:latest"
          echo "Building $IMAGE_SHA"
          docker buildx build \
            --platform linux/amd64 \
            --tag "$IMAGE_SHA" \
            --tag "$IMAGE_LATEST" \
            --push \
            services/forecasting_service_py
          echo "image=$IMAGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Trigger ECS deployment
        if: env.ECS_CLUSTER != '' && env.ECS_SERVICE != ''
        run: |
          echo "Forcing new ECS deployment: cluster=$ECS_CLUSTER service=$ECS_SERVICE"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --no-cli-pager \
            > /dev/null
          echo "Waiting for service to stabilize…"
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Summary
        if: always()
        run: |
          echo "## Deploy summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.build.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ECS cluster: \`${{ env.ECS_CLUSTER }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ECS service: \`${{ env.ECS_SERVICE }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Region: \`${{ env.AWS_REGION }}\`" >> "$GITHUB_STEP_SUMMARY"
